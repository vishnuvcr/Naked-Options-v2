# Generate a fresh Dhan token from the configured client ID, PIN, and TOTP secret at run time.
name: ZigZag expiry direction — acquire timeframe data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD); intraday API is limited to about 5 years"
        required: false
        type: string
        default: "2021-10-25"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: false
        type: string
        default: "2026-10-25"
      intervals:
        description: "Comma-separated Dhan intervals in minutes"
        required: false
        type: string
        default: "1,5,15,60"
      refresh_data:
        description: "Force a fresh download rather than reusing cached files"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "research/zigzag-expiry-direction-developer"
      - "research/tradingagents-feasibility-developer"
    paths:
      - "research/zigzag-expiry-direction/acquire_dhan_timeframes.py"
      - "research/zigzag-expiry-direction/prepare_timeframes.py"
      - "research/zigzag-expiry-direction/audit_sessions.py"
      - "research/tradingagents/acquire_public_intraday_archive.py"
      - "research/zigzag-expiry-direction/audit_public_5m.py"
      - "tests/test_zigzag_data_pipeline.py"
      - ".github/workflows/zigzag-expiry-timeframes.yml"

permissions:
  contents: read

concurrency:
  group: zigzag-dhan-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run data pipeline unit tests
        run: python -m unittest discover -s tests -p "test_zigzag_data_pipeline.py" -v
      - name: Restore reusable cached market data
        uses: actions/cache@v4
        with:
          path: data/cache/zigzag_expiry_direction
          key: zigzag-dhan-v1-${{ runner.os }}-${{ inputs.start_date || '2021-10-25' }}-${{ inputs.end_date || '2026-10-25' }}
      - name: Generate and validate Dhan token or select free fallback
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          python - <<'PY'
          import base64, hashlib, hmac, json, os, struct, time, urllib.parse, urllib.request
          from urllib.error import HTTPError, URLError

          client = os.environ.get("DHAN_CLIENT_ID", "").strip()
          pin = os.environ.get("DHAN_PIN", "").strip()
          secret = "".join(os.environ.get("DHAN_TOTP_SECRET", "").split()).upper()
          token = os.environ.get("DHAN_ACCESS_TOKEN", "").strip()

          def add_mask(value):
              if value:
                  print("::add-mask::" + value)

          def get_json(url, access_token=None, body=None):
              headers = {"Accept": "application/json"}
              if access_token:
                  headers["access-token"] = access_token
              if body is not None:
                  headers["Content-Type"] = "application/json"
              request = urllib.request.Request(url, data=body, headers=headers,
                                               method="POST" if body is not None else "GET")
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def valid_profile(candidate):
              profile = get_json("https://api.dhan.co/v2/profile", access_token=candidate)
              if client and str(profile.get("dhanClientId", "")) != client:
                  raise RuntimeError("profile client ID does not match configured client ID")
              return True

          add_mask(token)
          valid = False
          if token:
              try:
                  valid = valid_profile(token)
                  print("Configured Dhan access token validated.")
              except Exception:
                  print("Configured Dhan access token was invalid or expired; trying TOTP renewal if configured.")

          if not valid and client and pin and secret:
              try:
                  key = base64.b32decode(secret + "=" * ((8 - len(secret) % 8) % 8), casefold=True)
                  counter = int(time.time()) // 30
                  digest = hmac.new(key, struct.pack(">Q", counter), hashlib.sha1).digest()
                  offset = digest[-1] & 15
                  code = (struct.unpack(">I", digest[offset:offset + 4])[0] & 0x7fffffff) % 1_000_000
                  totp = f"{code:06d}"
                  query = urllib.parse.urlencode({"dhanClientId": client, "pin": pin, "totp": totp})
                  request = urllib.request.Request(
                      "https://auth.dhan.co/app/generateAccessToken?" + query,
                      data=b"", method="POST", headers={"Accept": "application/json"})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      payload = json.loads(response.read().decode("utf-8"))
                  token = payload.get("accessToken", "") if isinstance(payload, dict) else ""
                  if not token:
                      raise RuntimeError("Dhan token endpoint returned no access token")
                  add_mask(token)
                  valid_profile(token)
                  valid = True
                  print("Fresh Dhan access token generated and profile-validated.")
              except Exception as exc:
                  token = ""
                  print("Dhan token renewal failed safely: " + type(exc).__name__ + ". No credential values were logged.")

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env_file:
              if valid and token:
                  env_file.write("DHAN_ACCESS_TOKEN=" + token + "\n")
                  env_file.write("DATA_SOURCE=dhan\n")
              else:
                  env_file.write("DATA_SOURCE=yahoo\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              if valid and token:
                  summary.write("Dhan access token was validated; token values are masked and are not added to artifacts.\n")
              else:
                  summary.write("Dhan authentication was unavailable; switched to the free Yahoo fallback.\n")
          PY
      - name: Acquire missing or requested Dhan datasets
        id: acquire
        env:
          START_DATE: ${{ inputs.start_date || '2021-10-25' }}
          END_DATE: ${{ inputs.end_date || '2026-10-25' }}
          INTERVALS: ${{ inputs.intervals || '1,5,15,60' }}
          REFRESH_DATA: ${{ inputs.refresh_data || 'false' }}
        run: |
          if [ "${DATA_SOURCE:-dhan}" = "yahoo" ]; then
            python -m pip install --disable-pip-version-check yfinance
            python research/tradingagents/acquire_nifty_yahoo_fallback.py
          else
            ARGS=(--start "$START_DATE" --end "$END_DATE" --intervals "$INTERVALS")
            if [ "$REFRESH_DATA" = "true" ]; then ARGS+=(--refresh); fi
            python research/zigzag-expiry-direction/acquire_dhan_timeframes.py "${ARGS[@]}"
          fi
      - name: Acquire independent public five-year NIFTY 5-minute archive
        if: always() && steps.acquire.outcome == 'success'
        run: python research/tradingagents/acquire_public_intraday_archive.py
      - name: Validate data and derive 30-minute bars
        if: always()
        run: python research/zigzag-expiry-direction/prepare_timeframes.py --required 5,15,60,daily
      - name: Audit timestamps and session diagnostics (no silent exclusions)
        if: always()
        run: python research/zigzag-expiry-direction/audit_sessions.py
      - name: Detailed public five-minute archive audit
        if: always() && steps.acquire.outcome == 'success'
        run: python research/zigzag-expiry-direction/audit_public_5m.py
      - name: Upload dataset and provenance manifest (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zigzag-nifty50-data-${{ github.run_id }}
          path: |
            data/cache/zigzag_expiry_direction/*.csv
            reports/zigzag_data_manifest.json
            reports/zigzag_timeframe_validation.json
            reports/zigzag_session_audit.json
            reports/public_intraday_sources.json
            reports/public_5m_diagnostic_audit.json
          if-no-files-found: warn
          retention-days: 30
