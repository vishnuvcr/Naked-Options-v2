name: QE-NOB-2.0 candidate generator tests

on:
  workflow_dispatch:
  push:
    branches:
      - research/quant-evolve-nob-v2-discovery-developer
    paths:
      - research/quant-evolve-nob/strategy_grammar_v2.py
      - research/quant-evolve-nob/evolve_candidates_v2.py
      - research/quant-evolve-nob/test_evolve_candidates_v2.py
      - research/quant-evolve-nob/training_fitness_v2.py
      - research/quant-evolve-nob/test_training_fitness_v2.py research/quant-evolve-nob/test_run_discovery_v2.py
      - research/quant-evolve-nob/option_simulator_v2.py
      - research/quant-evolve-nob/run_discovery_v2.py
      - research/quant-evolve-nob/test_run_discovery_v2.py
      - .github/workflows/qe-nob-v2-candidate-generator-tests.yml

permissions:
  contents: read

concurrency:
  group: qe-nob-v2-candidate-generator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate-generator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependency
        run: python -m pip install --upgrade pytest pandas numpy scipy requests
      - name: Test bounded candidate generator
        run: pytest -q research/quant-evolve-nob/test_evolve_candidates_v2.py research/quant-evolve-nob/test_training_fitness_v2.py
