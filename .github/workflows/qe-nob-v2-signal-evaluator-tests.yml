name: QE-NOB-2.0 signal evaluator tests

on:
  workflow_dispatch:
  push:
    branches:
      - research/quant-evolve-nob-v2-discovery-developer
    paths:
      - research/quant-evolve-nob/strategy_grammar_v2.py
      - research/quant-evolve-nob/signal_evaluator_v2.py
      - research/quant-evolve-nob/test_signal_evaluator_v2.py
      - .github/workflows/qe-nob-v2-signal-evaluator-tests.yml

permissions:
  contents: read

concurrency:
  group: qe-nob-v2-signal-evaluator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  signal-evaluator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pandas
      - name: Test leakage-aware signal evaluation
        run: pytest -q research/quant-evolve-nob/test_signal_evaluator_v2.py
