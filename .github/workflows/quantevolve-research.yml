name: QuantEvolve bounded research

on:
  push:
    branches: [research/quantevolve-integration]
    paths:
      - "configs/quantevolve/run_request.json"
      - ".github/workflows/quantevolve-research.yml"
  workflow_dispatch:
    inputs:
      track:
        description: "Research track"
        type: choice
        options: [prediction, options]
        required: true
        default: prediction
      run_llm:
        description: "Run bounded Gemini evolution (uses API quota)"
        type: boolean
        required: true
        default: false
      iterations:
        description: "Maximum evolution iterations"
        type: choice
        options: ["1", "2", "3", "4"]
        required: true
        default: "4"
      refresh_data:
        description: "Refresh sources even if a validated cache exists"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: quantevolve-research-${{ github.ref }}
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout without persisting a write credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/quantevolve/requirements-pinned.txt
      - name: Resolve bounded run request
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TRACK: ${{ inputs.track }}
          INPUT_RUN_LLM: ${{ inputs.run_llm }}
          INPUT_ITERATIONS: ${{ inputs.iterations }}
          INPUT_REFRESH_DATA: ${{ inputs.refresh_data }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf 'track=%s\n' "$INPUT_TRACK" >> "$GITHUB_OUTPUT"
            printf 'run_llm=%s\n' "$INPUT_RUN_LLM" >> "$GITHUB_OUTPUT"
            printf 'iterations=%s\n' "$INPUT_ITERATIONS" >> "$GITHUB_OUTPUT"
            printf 'refresh_data=%s\n' "$INPUT_REFRESH_DATA" >> "$GITHUB_OUTPUT"
          else
            python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          d=json.load(open("configs/quantevolve/run_request.json", encoding="utf-8"))
          if d.get("track") not in {"prediction","options"}: raise SystemExit("invalid track")
          it=int(d.get("iterations",4))
          if not 1 <= it <= 4: raise SystemExit("iterations must be 1..4")
          print("track="+d["track"])
          print("run_llm="+str(bool(d.get("run_llm",False))).lower())
          print("iterations="+str(it))
          print("refresh_data="+str(bool(d.get("refresh_data",False))).lower())
          PY
          fi
      - name: Install pinned research dependencies
        run: python -m pip install --disable-pip-version-check -r tools/quantevolve/requirements-pinned.txt
      - name: Run protocol and adapter tests
        id: tests
        continue-on-error: true
        run: python -m pytest -q tests/test_quantevolve_integration_protocol.py tests/test_quantevolve_adapters.py
      - name: Restore reusable target data cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/cache
            reports/data_manifest.json
            reports/data_quality.json
          key: nifty-pred-v1-${{ runner.os }}-${{ hashFiles('requirements-research.txt', 'scripts/acquire_data.py') }}-qe-${{ github.run_id }}
          restore-keys: |
            nifty-pred-v1-${{ runner.os }}-${{ hashFiles('requirements-research.txt', 'scripts/acquire_data.py') }}-
      - name: Acquire NIFTY history and global proxies if cache is missing/refresh requested
        id: acquire
        continue-on-error: true
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: |
          if [ ! -f data/cache/nifty50_daily.csv ] || [ ! -f reports/data_manifest.json ] || [ "${{ steps.request.outputs.refresh_data }}" = "true" ]; then
            python scripts/acquire_data.py --start 2007-01-01 --external
          else
            echo "Restored cache will be accepted only after manifest/hash validation."
          fi
      - name: Validate cached daily series
        id: validate
        continue-on-error: true
        run: python scripts/validate_data.py
      - name: One bounded acquisition retry if validation fails
        id: retry_acquire
        if: steps.validate.outcome != 'success'
        continue-on-error: true
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python scripts/acquire_data.py --start 2007-01-01 --external
      - name: Revalidate after retry
        id: retry_validate
        if: steps.validate.outcome != 'success'
        continue-on-error: true
        run: python scripts/validate_data.py
      - name: Resolve data-gate status
        id: data_gate
        if: always()
        env:
          FIRST_VALIDATION: ${{ steps.validate.outcome }}
          SECOND_VALIDATION: ${{ steps.retry_validate.outcome }}
        run: |
          if [ "$FIRST_VALIDATION" = "success" ] || [ "$SECOND_VALIDATION" = "success" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run options source/contract quality gate only
        if: always()
        run: |
          python tools/quantevolve/options_contract_gate.py \
            --input data/cache/nifty_options_contracts.csv \
            --source-manifest data/cache/options_source_manifest.json \
            --underlying data/cache/nifty50_daily.csv \
            --output reports/quantevolve/options_data_gate.json
      - name: Checkout the pinned QuantEvolve upstream revision
        id: upstream
        if: steps.request.outputs.track == 'prediction' && steps.request.outputs.run_llm == 'true' && steps.tests.outcome == 'success' && steps.data_gate.outputs.ready == 'true'
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/tarsyang/quantevolve.git /tmp/quantevolve
          git -C /tmp/quantevolve checkout --detach 2df1e85758620e8ac0ca88ffc428b379d6cb9620
          test "$(git -C /tmp/quantevolve rev-parse HEAD)" = "2df1e85758620e8ac0ca88ffc428b379d6cb9620"
          python -m pip install --disable-pip-version-check --no-deps -e /tmp/quantevolve
          cp tools/quantevolve/modern_gemini_provider.py /tmp/quantevolve/quantevolve/llm/gemini.py
      - name: Run four-iteration maximum prediction evolution and one holdout score
        id: evolve
        if: steps.request.outputs.track == 'prediction' && steps.request.outputs.run_llm == 'true' && steps.tests.outcome == 'success' && steps.data_gate.outputs.ready == 'true' && steps.upstream.outcome == 'success'
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python tools/quantevolve/run_prediction.py \
            --upstream-dir /tmp/quantevolve \
            --data data/cache/nifty50_daily.csv \
            --output "reports/quantevolve/prediction/run-${{ github.run_id }}" \
            --iterations "${{ steps.request.outputs.iterations }}" \
            --run-id "${{ github.run_id }}"
      - name: Record blocked/skipped prediction run
        if: always() && steps.request.outputs.track == 'prediction' && steps.request.outputs.run_llm == 'true' && (steps.tests.outcome != 'success' || steps.data_gate.outputs.ready != 'true' || steps.upstream.outcome != 'success')
        env:
          RUN_ID: ${{ github.run_id }}
          TEST_RESULT: ${{ steps.tests.outcome }}
          DATA_READY: ${{ steps.data_gate.outputs.ready }}
          UPSTREAM_RESULT: ${{ steps.upstream.outcome }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          run_id=os.environ["RUN_ID"]
          path=Path("reports/quantevolve/prediction")/("run-"+run_id)
          path.mkdir(parents=True, exist_ok=True)
          if os.environ.get("TEST_RESULT") != "success":
              status, reason = "BLOCKED_AUTOMATED_TESTS", "integration test gate did not pass"
          elif os.environ.get("DATA_READY") != "true":
              status, reason = "BLOCKED_DATA_GATE", "no validated daily target after one bounded retry"
          else:
              status, reason = "BLOCKED_UPSTREAM_SETUP", "pinned upstream checkout/install did not pass"
          (path/"run_manifest.json").write_text(json.dumps({
              "protocol":"QE-NIFTY-1.0","track":"prediction","run_id":run_id,
              "status":status,"block_reason":reason,"candidate_source_executed":False,
              "performance_claim":None
          }, indent=2)+"\n")
          print(json.dumps({"status":status,"reason":reason}))
          PY
      - name: Save validated cache
        if: always() && steps.data_gate.outputs.ready == 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/cache
            reports/data_manifest.json
            reports/data_quality.json
          key: nifty-pred-v1-${{ runner.os }}-${{ hashFiles('requirements-research.txt', 'scripts/acquire_data.py') }}-qe-${{ github.run_id }}
      - name: Upload sanitized reports only
        uses: actions/upload-artifact@v4
        with:
          name: qe-research-report-${{ github.run_id }}
          path: reports/quantevolve
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: research
    if: always() && needs.research.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout this research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Download sanitized report artifact
        id: download
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: qe-research-report-${{ github.run_id }}
          path: artifact-inbox
      - name: Update logs and publish sanitized evidence
        env:
          RUN_ID: ${{ github.run_id }}
        run: python tools/quantevolve/publish_run.py --artifact-root artifact-inbox --run-id "$RUN_ID"
      - name: Commit generated safe reports and progress logs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md research/EXPERIMENT_LOG.md research/QUANTEvolve_INTEGRATION_STATUS.md research/QUANTEvolve_INTEGRATION_ERROR_LOG.md reports/quantevolve
          if git diff --cached --quiet; then
            echo "No report/status changes to commit."
          else
            git commit -m "Publish QuantEvolve run ${{ github.run_id }} results"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
