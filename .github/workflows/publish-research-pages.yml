name: Publish research status page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "README.md"
      - "research/RESULTS.md"
      - "research/PHASE_STATUS.md"
      - "research/MANUSCRIPT.md"
      - "research/figures/**"
      - ".github/workflows/publish-research-pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: research-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static research page
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Deploy research page
        id: deployment
        uses: actions/deploy-pages@v4
