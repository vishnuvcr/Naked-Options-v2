name: QE-NOB-3.0 public NSE bhavcopy feasibility

on:
  workflow_dispatch:
  push:
    branches:
      - research/qe-nob-v3-hypothesis-lab
    paths:
      - .github/workflows/qe-nob-v3-nse-bhavcopy.yml
      - research/quant-evolve-nob/probe_nse_bhavcopy.py

permissions:
  contents: read

jobs:
  nse-daily-data-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install probe dependency
        run: python -m pip install requests
      - name: Probe up to three official NSE archives
        run: python research/quant-evolve-nob/probe_nse_bhavcopy.py
      - name: Upload schema and coverage report plus compressed public samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-nob-v3-nse-bhavcopy-feasibility
          path: |
            reports/quant_evolve_nob_v2/nse_bhavcopy_feasibility.json
            data/cache/nse_fno_bhavcopy_probe/*.zip
          if-no-files-found: warn
          retention-days: 30
