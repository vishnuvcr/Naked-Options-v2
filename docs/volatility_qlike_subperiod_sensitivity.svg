<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="535" viewBox="0 0 1000 535" role="img" aria-labelledby="title desc">
<title id="title">One-session volatility-proxy QLIKE loss differences across four holdout slices</title>
<desc id="desc">Four equal-count chronological slices of the same final holdout. Mean model-minus-baseline QLIKE losses are negative, with 95 percent moving-block confidence intervals below zero. Overall median loss difference is positive, and model loss is worse on just over half of days, so the mean improvement is skewed rather than uniform.</desc>
<rect width="1000" height="535" fill="#ffffff"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#17212b">
  <text x="48" y="42" font-size="25" font-weight="700">One-session volatility forecast: temporal sensitivity</text>
  <text x="48" y="71" font-size="15" fill="#4b5563">Model − baseline QLIKE loss (lower is better) · Four equal-count slices of the same final holdout</text>
  <text x="48" y="102" font-size="13" fill="#4b5563">Bars show 95% moving-block intervals; circles show mean loss differences. Zero is the no-difference reference.</text>
</g>
<g stroke="#e5e7eb" stroke-width="1">
  <line x1="373" y1="122" x2="373" y2="408"/>
  <line x1="520" y1="122" x2="520" y2="408"/>
  <line x1="667" y1="122" x2="667" y2="408"/>
  <line x1="850" y1="122" x2="850" y2="408"/>
</g>
<line x1="813" y1="119" x2="813" y2="410" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 5"/>
<g stroke="#334155" stroke-width="3" stroke-linecap="round" fill="none">
  <line x1="493" y1="155" x2="736.5" y2="155"/><line x1="493" y1="146" x2="493" y2="164"/><line x1="736.5" y1="146" x2="736.5" y2="164"/>
  <line x1="381.1" y1="225" x2="742.5" y2="225"/><line x1="381.1" y1="216" x2="381.1" y2="234"/><line x1="742.5" y1="216" x2="742.5" y2="234"/>
  <line x1="477.3" y1="295" x2="720.9" y2="295"/><line x1="477.3" y1="286" x2="477.3" y2="304"/><line x1="720.9" y1="286" x2="720.9" y2="304"/>
  <line x1="370.0" y1="365" x2="697.0" y2="365"/><line x1="370.0" y1="356" x2="370.0" y2="374"/><line x1="697.0" y1="356" x2="697.0" y2="374"/>
</g>
<g fill="#264653" stroke="#ffffff" stroke-width="2">
  <circle cx="620" cy="155" r="7"/><circle cx="555.5" cy="225" r="7"/><circle cx="610" cy="295" r="7"/><circle cx="542" cy="365" r="7"/>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#17212b">
  <text x="48" y="149" font-size="16" font-weight="700">Window 1</text><text x="48" y="169" font-size="13" fill="#4b5563">2022-11-04 to 2023-11-01 · n=246</text>
  <text x="48" y="219" font-size="16" font-weight="700">Window 2</text><text x="48" y="239" font-size="13" fill="#4b5563">2023-11-02 to 2024-10-25 · n=245</text>
  <text x="48" y="289" font-size="16" font-weight="700">Window 3</text><text x="48" y="309" font-size="13" fill="#4b5563">2024-10-28 to 2025-10-21 · n=245</text>
  <text x="48" y="359" font-size="16" font-weight="700">Window 4</text><text x="48" y="379" font-size="13" fill="#4b5563">2025-10-23 to 2026-10-19 · n=245</text>
</g>
<line x1="300" y1="410" x2="850" y2="410" stroke="#374151" stroke-width="1.5"/>
<g font-family="Arial, Helvetica, sans-serif" fill="#374151" font-size="13" text-anchor="middle">
  <text x="373" y="432">−0.6</text><text x="520" y="432">−0.4</text><text x="667" y="432">−0.2</text><text x="813" y="432">0</text><text x="850" y="432">+0.05</text>
</g>
<g font-family="Arial, Helvetica, sans-serif" fill="#17212b">
  <text x="48" y="465" font-size="15" font-weight="700">Interpretation guardrail</text>
  <text x="48" y="489" font-size="14">The overall mean difference is −0.3156, but the median is +0.0066 and model loss is worse on 50.97% of days.</text>
  <text x="48" y="511" font-size="14" fill="#4b5563">A 10% winsorized mean remains negative (−0.1014). These slices reuse the same holdout and are not an independent-period replication.</text>
</g>
</svg>