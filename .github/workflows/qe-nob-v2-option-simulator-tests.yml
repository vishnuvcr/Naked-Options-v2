name: QE-NOB-2.0 option simulator tests

on:
  workflow_dispatch:
  push:
    branches:
      - research/quant-evolve-nob-v2-discovery-developer
    paths:
      - research/quant-evolve-nob/strategy_grammar_v2.py
      - research/quant-evolve-nob/signal_evaluator_v2.py
      - research/quant-evolve-nob/option_simulator_v2.py
      - research/quant-evolve-nob/test_option_simulator_v2.py
      - .github/workflows/qe-nob-v2-option-simulator-tests.yml

permissions:
  contents: read

concurrency:
  group: qe-nob-v2-option-simulator-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pandas
      - name: Test cost and simulator invariants
        run: pytest -q research/quant-evolve-nob/test_option_simulator_v2.py
