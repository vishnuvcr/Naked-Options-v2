name: QE-NOB-2.0 point-in-time feature builder tests

on:
  workflow_dispatch:
  push:
    branches:
      - research/quant-evolve-nob-v2-discovery-developer
    paths:
      - research/quant-evolve-nob/feature_builder_v2.py
      - research/quant-evolve-nob/test_feature_builder_v2.py
      - .github/workflows/qe-nob-v2-feature-builder-tests.yml

permissions:
  contents: read

concurrency:
  group: qe-nob-v2-feature-builder-${{ github.ref }}
  cancel-in-progress: true

jobs:
  feature-builder-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pandas numpy
      - name: Test point-in-time feature construction
        run: pytest -q research/quant-evolve-nob/test_feature_builder_v2.py
