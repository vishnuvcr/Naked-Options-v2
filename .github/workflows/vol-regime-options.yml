name: Volatility-regime weekly options research

on:
  workflow_dispatch:
  push:
    branches:
      - research/vol-regime-options-developer
    paths:
      - .github/workflows/vol-regime-options.yml
      - research/VOL_REGIME_OPTIONS_PLAN.md
      - research/vol-regime-options/source_probe.py

permissions:
  contents: write

concurrency:
  group: vol-regime-options-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Restore private market data cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: vol-regime-options-${{ runner.os }}-${{ hashFiles('research/vol-regime-options/source_probe.py') }}
          restore-keys: |
            vol-regime-options-${{ runner.os }}-
            nifty-option-validation-Linux-
            nifty-pred-v1-Linux-
      - name: Install minimal dependency
        run: python -m pip install requests
      - name: Probe weekly and monthly Dhan schemas
        id: probe
        continue-on-error: true
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
        run: python research/vol-regime-options/source_probe.py
      - name: Save private response cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: vol-regime-options-${{ runner.os }}-${{ hashFiles('research/vol-regime-options/source_probe.py') }}-${{ github.run_id }}
      - name: Commit sanitized source audit
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f reports/vol_regime_options/source_audit.json ]; then
            git add reports/vol_regime_options/source_audit.json
            if ! git diff --cached --quiet; then
              git commit -m "research: record weekly options source audit run $RUN_ID"
              git push
            fi
          fi
      - name: Upload sanitized audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vol-regime-source-audit-${{ github.run_id }}
          path: reports/vol_regime_options/source_audit.json
          if-no-files-found: warn
          retention-days: 90
