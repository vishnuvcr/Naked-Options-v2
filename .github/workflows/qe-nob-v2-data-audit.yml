name: QE-NOB-2.0 bounded data acquisition and feature audit (ATM-OTM1 recovery)

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Force refresh source cache; otherwise reuse cache where available
        required: false
        type: boolean
        default: false
  push:
    branches:
      - research/quant-evolve-nob-v2-discovery-developer
    paths:
      - .github/workflows/qe-nob-v2-data-audit.yml
      - research/quant-evolve-nob/feature_audit_v2.py
      - research/quant-evolve-nob/FEATURE_FEASIBILITY_V2.md
      - research/quant-evolve-nob/run_research.py
      - research/quant-evolve-nob/test_run_research.py
      - research/quant-evolve-nob/config.json

# Scope amendment 2026-10-23: only ATM and one-step OTM offsets are in the active candidate grammar.

permissions:
  contents: read

concurrency:
  group: qe-nob-v2-data-audit-${{ github.ref }}
  # Only an explicitly named recovery commit may cancel a stale acquisition; routine pushes preserve it.
  cancel-in-progress: ${{ contains(github.event.head_commit.message, 'Recover stuck acquisition') }}

jobs:
  bounded-source-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout developer branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Restore QE-NOB runtime cache if available
        uses: actions/cache/restore@v4
        with:
          path: data/cache/quant_evolve_nob_v1
          key: qe-nob-v2-${{ runner.os }}-${{ hashFiles('research/quant-evolve-nob/run_research.py', 'research/quant-evolve-nob/config.json') }}-seed
          restore-keys: |
            qe-nob-v2-${{ runner.os }}-${{ hashFiles('research/quant-evolve-nob/run_research.py', 'research/quant-evolve-nob/config.json') }}-
            qe-nob-v2-${{ runner.os }}-
      - name: Install bounded research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt scipy pandas numpy requests pytest
      - name: Validate source client before acquisition
        run: pytest -q research/quant-evolve-nob/test_run_research.py
      - name: Acquire source data without candidate fitness or P&L
        timeout-minutes: 160
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REFRESH_DATA: ${{ inputs.refresh_data }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -u
          cache_state() {
            find data/cache/quant_evolve_nob_v1 -type f -name '*.json' ! -name 'probe_*' -printf '%P %s %T@\n' 2>/dev/null | sort | sha256sum | cut -d ' ' -f1
          }
          for pass in 1 2 3; do
            echo "[QE-NOB-2.0] bounded acquisition pass $pass/3"
            before="$(cache_state)"
            if [ "$REFRESH_DATA" = "true" ] && [ "$pass" -eq 1 ]; then
              if python research/quant-evolve-nob/run_research.py --stage acquire --refresh-data; then
                exit 0
              else
                rc=$?
              fi
            else
              if python research/quant-evolve-nob/run_research.py --stage acquire; then
                exit 0
              else
                rc=$?
              fi
            fi
            after="$(cache_state)"
            echo "[QE-NOB-2.0] pass $pass ended rc=$rc; cache fingerprint before=$before after=$after"
            if [ "$before" = "$after" ]; then
              echo "[QE-NOB-2.0] no cache progress detected; stopping retries to avoid an unproductive loop."
              break
            fi
            if [ "$pass" -lt 3 ]; then sleep 2; fi
          done
          echo "[QE-NOB-2.0] acquisition did not pass after bounded resumption; downstream discovery must remain blocked."
          exit 2
      - name: Audit acquired or restored local cache
        if: always()
        run: python research/quant-evolve-nob/feature_audit_v2.py
      - name: Run bounded discovery after cache audit
        if: success()
        run: |
          python research/quant-evolve-nob/run_discovery_v2.py \
            --budget 1200 \
            --generations 20 \
            --population-size 64 \
            --islands 4 \
            --seeds 1729 20261022 8675309 31415927 \
            --finalists 20

      - name: Save cache for future QE-NOB-2.0 runs
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache/quant_evolve_nob_v1
          key: qe-nob-v2-${{ runner.os }}-${{ hashFiles('research/quant-evolve-nob/run_research.py', 'research/quant-evolve-nob/config.json') }}-${{ github.run_id }}
      - name: Upload sanitized acquisition and feature reports only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-nob-v2-data-audit-${{ github.run_id }}
          path: |
            reports/quant_evolve_nob_v1/source_probe.json
            reports/quant_evolve_nob_v1/acquisition_summary.json
            reports/quant_evolve_nob_v1/underlying_summary.json
            reports/quant_evolve_nob_v1/source_failures.csv
            reports/quant_evolve_nob_v2/feature_availability.json
            reports/quant_evolve_nob_v2/run_summary.json
            reports/quant_evolve_nob_v2/RESULTS.md
            reports/quant_evolve_nob_v2/candidate_archive.json
            reports/quant_evolve_nob_v2/candidate_training_metrics.csv
            reports/quant_evolve_nob_v2/candidate_validation_metrics.csv
            reports/quant_evolve_nob_v2/finalist_oos_metrics.csv
            reports/quant_evolve_nob_v2/oos_cost_stress.csv
            reports/quant_evolve_nob_v2/oos_trade_ledger_sanitized.csv
          if-no-files-found: warn
          retention-days: 90
