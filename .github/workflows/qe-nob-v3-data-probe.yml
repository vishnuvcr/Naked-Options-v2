name: QE-NOB-3.0 fresh-data eligibility probe

on:
  workflow_dispatch:
  push:
    branches:
      - research/qe-nob-v3-hypothesis-lab
    paths:
      - .github/workflows/qe-nob-v3-data-probe.yml
      - research/quant-evolve-nob/run_research.py

permissions:
  contents: read

jobs:
  data-eligibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - name: Checkout this branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Install minimal probe dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt
      - name: Run credential and source schema probe only
        run: |
          python research/quant-evolve-nob/run_research.py --stage probe
      - name: Upload sanitized probe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qe-nob-v3-sanitized-data-probe
          path: |
            reports/quant_evolve_nob_v2/source_probe.json
          if-no-files-found: warn
          retention-days: 30
