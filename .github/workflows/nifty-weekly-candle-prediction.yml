name: NWCP-1.0 weekly direction research

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Force re-download of public source and Dhan chunks
        required: false
        type: boolean
        default: false
  push:
    branches:
      - research/nifty-weekly-candle-prediction-developer
      - research/nifty-weekly-candle-prediction-tester
    paths:
      - .github/workflows/nifty-weekly-candle-prediction.yml
      - research/nifty-weekly-candle-prediction/run_research.py
      - research/nifty-weekly-candle-prediction/test_research.py
      - research/nifty-weekly-candle-prediction/requirements.txt

permissions:
  contents: read

concurrency:
  group: nwcp-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-audit-and-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 210
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/nifty-weekly-candle-prediction/requirements.txt
      - name: Restore public and Dhan source cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache/nifty_weekly_candle_prediction_v1/public
          key: nwcp-v1-${{ runner.os }}-${{ hashFiles('research/nifty-weekly-candle-prediction/run_research.py') }}-${{ github.run_id }}
          restore-keys: |
            nwcp-v1-${{ runner.os }}-${{ hashFiles('research/nifty-weekly-candle-prediction/run_research.py') }}-
            nwcp-v1-${{ runner.os }}-
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r research/nifty-weekly-candle-prediction/requirements.txt
      - name: Run unit tests before data acquisition
        run: pytest -q research/nifty-weekly-candle-prediction/test_research.py
      - name: Bounded source acquisition and preliminary model comparison
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          NWCP_DHAN_CACHE_DIR: ${{ runner.temp }}/nwcp_dhan_cache
          REFRESH_DATA: ${{ inputs.refresh_data || false }}
          PYTHONUNBUFFERED: "1"
        run: |
          set -euo pipefail
          args=()
          if [ "$REFRESH_DATA" = "true" ]; then args+=(--refresh-data); fi
          python research/nifty-weekly-candle-prediction/run_research.py --stage all "${args[@]}"
      - name: Save cache even after a source failure
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache/nifty_weekly_candle_prediction_v1/public
          key: nwcp-v1-${{ runner.os }}-${{ hashFiles('research/nifty-weekly-candle-prediction/run_research.py') }}-${{ github.run_id }}
      - name: Upload sanitized audit and metrics only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nwcp-v1-audit-${{ github.run_id }}
          path: |
            reports/nifty_weekly_candle_prediction_v1/source_manifest.json
            reports/nifty_weekly_candle_prediction_v1/data_quality_audit.json
            reports/nifty_weekly_candle_prediction_v1/RESULTS.md
            reports/nifty_weekly_candle_prediction_v1/runtime_error.json
          if-no-files-found: warn
          retention-days: 90
