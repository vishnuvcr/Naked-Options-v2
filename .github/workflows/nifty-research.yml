name: NIFTY prediction research

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: "Refresh cached market data from sources"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "20 23 1 * *"
  push:
    branches: [main, "research/**", "developer/**", "tester/**"]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements-research.txt"
      - "research/RESEARCH_PLAN.md"
      - ".github/workflows/nifty-research.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nifty-prediction-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-research.txt
      - name: Restore reusable market-data cache
        id: market-cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            reports/data_manifest.json
          key: nifty-pred-v1-${{ runner.os }}-${{ hashFiles('requirements-research.txt', 'scripts/acquire_data.py') }}-${{ github.run_id }}
          restore-keys: |
            nifty-pred-v1-${{ runner.os }}-${{ hashFiles('requirements-research.txt', 'scripts/acquire_data.py') }}-
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-research.txt
      - name: Install optional CPU PyTorch sequence-model dependency
        continue-on-error: true
        run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Acquire data (cache hit is reused unless refresh requested)
        continue-on-error: true
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ ! -f data/cache/nifty50_daily.csv ] || [ ! -f reports/data_manifest.json ] || [ "${{ github.event.inputs.refresh_data }}" = "true" ] || [ "${{ github.event_name }}" = "schedule" ]; then
            python scripts/acquire_data.py --start 2007-01-01 --external
          else
            echo "Reusing restored target cache; data acquisition intentionally skipped."
          fi
      - name: Validate target data
        id: validate
        continue-on-error: true
        run: python scripts/validate_data.py
      - name: Test target construction and scoring
        run: python -m pytest -q
      - name: Refresh cache if validation failed
        if: steps.validate.outcome != 'success'
        continue-on-error: true
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/acquire_data.py --start 2007-01-01 --external
      - name: Revalidate after refresh
        id: validate_retry
        if: steps.validate.outcome != 'success'
        continue-on-error: true
        run: python scripts/validate_data.py
      - name: Enforce data gate
        if: steps.validate.outcome != 'success' && steps.validate_retry.outcome != 'success'
        run: |
          echo "No validated target series after one explicit refresh. Phase 3 is blocked; no model result will be claimed."
          exit 2
      - name: Build feature matrix
        id: features
        if: steps.validate.outcome == 'success' || steps.validate_retry.outcome == 'success'
        run: python scripts/build_feature_matrix.py
      - name: Run technical-only model catalogue
        if: always() && (steps.validate.outcome == 'success' || steps.validate_retry.outcome == 'success') && steps.features.outcome == 'success'
        run: python scripts/run_experiments.py --features technical
      - name: Run global-augmented model catalogue
        if: always() && (steps.validate.outcome == 'success' || steps.validate_retry.outcome == 'success') && steps.features.outcome == 'success'
        run: python scripts/run_experiments.py --features global
      - name: Run ARIMA return benchmark
        if: always() && (steps.validate.outcome == 'success' || steps.validate_retry.outcome == 'success') && steps.features.outcome == 'success'
        continue-on-error: true
        run: python scripts/run_arima_baseline.py
      - name: Merge model, feature and benchmark results
        if: always() && (steps.validate.outcome == 'success' || steps.validate_retry.outcome == 'success') && steps.features.outcome == 'success'
        run: python scripts/merge_results.py
      - name: Summarize data / run outcomes
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("reports/run_status.json")
          def read(path):
              f=Path(path)
              if not f.exists(): return {"status":"NOT_CREATED"}
              try: return json.loads(f.read_text())
              except Exception: return {"status":"UNREADABLE"}
          p.parent.mkdir(exist_ok=True, parents=True)
          p.write_text(json.dumps({
              "workflow_run_id": "${{ github.run_id }}",
              "ref": "${{ github.ref }}",
              "sha": "${{ github.sha }}",
              "data_manifest": read("reports/data_manifest.json"),
              "data_quality": read("reports/data_quality.json"),
              "experiment_run": read("reports/feature_ablation.json"),
          }, indent=2))
          PY
      - name: Generate research status page
        if: always()
        continue-on-error: true
        run: python scripts/build_site.py
      - name: Configure GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Upload reproducible reports (raw/licensed market data excluded)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-prediction-reports-${{ github.run_id }}
          path: |
            reports/*.json
            reports/metrics.csv
            reports/predictions.csv
            reports/experiment_errors.csv
            reports/metrics_*.csv
            reports/predictions_*.csv
            reports/experiment_errors_*.csv
            reports/arima_metrics.csv
            reports/arima_predictions.csv
            research/ERROR_LOG.md
            research/EXPERIMENT_LOG.md
            research/PHASE_STATUS.md
          if-no-files-found: warn
          retention-days: 90

  publish-pages:
    if: always() && github.ref == 'refs/heads/main'
    needs: research
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy research status page
        id: deployment
        uses: actions/deploy-pages@v4
