name: NIFTY weekly-expiry prediction hypotheses
on:
  workflow_dispatch:
  push:
    branches: [research/tradingagents-feasibility-developer, research/nifty-prediction-developer]
    paths:
      - "research/nifty-prediction/evaluate_weekly_expiry_hypotheses.py"
      - ".github/workflows/nifty-weekly-expiry-hypotheses.yml"
permissions:
  contents: write
concurrency:
  group: nifty-weekly-expiry-hypotheses-${{ github.ref }}
  cancel-in-progress: false
jobs:
  weekly-hypotheses:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn
      - name: Require cached NIFTY data
        run: test -s data/cache/nifty-prediction/nifty50_daily.csv
      - name: Run weekly-expiry hypothesis suite
        run: python research/nifty-prediction/evaluate_weekly_expiry_hypotheses.py
      - name: Persist results
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/nifty-prediction/weekly_expiry_hypotheses.json
          git commit -m "Record weekly-expiry prediction hypotheses" || exit 0
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH_NAME"; then exit 0; fi
            git fetch origin "$BRANCH_NAME"
            git rebase "origin/$BRANCH_NAME"
          done
          echo "Unable to persist report after three attempts"; exit 1
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-weekly-expiry-hypotheses
          path: reports/nifty-prediction/weekly_expiry_hypotheses.json
          if-no-files-found: warn
          retention-days: 90
