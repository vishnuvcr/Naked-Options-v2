name: NSE historical options data validation
on:
  workflow_dispatch:
  push:
    branches: [research/tradingagents-feasibility-developer, research/nifty-prediction-developer]
    paths:
      - "research/nifty-prediction/audit_nse_options_sample.py"
      - ".github/workflows/nse-options-data-audit.yml"
permissions:
  contents: write
concurrency:
  group: nse-options-data-audit-${{ github.ref }}
  cancel-in-progress: false
jobs:
  sample-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download and audit official NSE historical samples
        run: python research/nifty-prediction/audit_nse_options_sample.py
      - name: Persist machine-readable audit report
        if: always()
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/nifty-prediction/nse_options_sample_audit.json
          git commit -m "Record NSE options data source audit" || exit 0
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH_NAME"; then exit 0; fi
            git fetch origin "$BRANCH_NAME"
            git rebase "origin/$BRANCH_NAME"
          done
          echo "Unable to persist audit report after three attempts"; exit 1
      - name: Preserve raw source files and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nse-options-sample-audit
          path: |
            data/cache/nse-options-sample/
            reports/nifty-prediction/nse_options_sample_audit.json
          if-no-files-found: warn
          retention-days: 90
