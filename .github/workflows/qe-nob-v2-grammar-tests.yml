name: QE-NOB-2.0 grammar validation

on:
  workflow_dispatch:
  push:
    branches:
      - research/quant-evolve-nob-v2-discovery-developer
    paths:
      - research/quant-evolve-nob/strategy_grammar_v2.py
      - research/quant-evolve-nob/test_strategy_grammar_v2.py
      - research/quant-evolve-nob/feature_audit_v2.py
      - research/quant-evolve-nob/test_feature_audit_v2.py
      - .github/workflows/qe-nob-v2-grammar-tests.yml

permissions:
  contents: read

concurrency:
  group: qe-nob-v2-grammar-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grammar-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: python -m pip install --upgrade pytest
      - name: Test typed strategy grammar and feature audit
        run: pytest -q research/quant-evolve-nob/test_strategy_grammar_v2.py research/quant-evolve-nob/test_feature_audit_v2.py
