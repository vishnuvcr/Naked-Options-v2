<title id="title">Preliminary NIFTY 50 direction diagnostic: balanced accuracy</title>
<desc id="desc">Balanced accuracy for majority baseline 50.00 percent, previous session direction 52.60 percent with interval 49.72 to 55.56, zero-return forecast 50.00 percent, and custom logistic regression 52.78 percent with interval 50.11 to 55.36. Historical data ends in 2019. Results are preliminary.</desc>
