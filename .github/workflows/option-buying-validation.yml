name: NIFTY option-buying validation

on:
  workflow_dispatch:
    inputs:
      refresh_options:
        description: Redownload Dhan rolling option windows instead of reusing cache
        required: false
        type: boolean
        default: false
  push:
    branches:
      - research/option-buying-validation
    paths:
      - .github/workflows/option-buying-validation.yml
      - research/OPTION_BUYING_VALIDATION_PLAN.md
      - research/option-validation/backtest.py
      - research/option-validation/test_backtest.py
      - requirements-option-validation.txt

permissions:
  contents: write

concurrency:
  group: option-buying-validation
  cancel-in-progress: false

jobs:
  validate-and-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements-research.txt
            requirements-option-validation.txt

      - name: Restore underlying and private option-data cache
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            reports/data_quality.json
          key: nifty-option-validation-${{ runner.os }}-${{ hashFiles('research/option-validation/backtest.py', 'scripts/build_feature_matrix.py', 'requirements-option-validation.txt') }}
          restore-keys: |
            nifty-option-validation-${{ runner.os }}-
            nifty-pred-v1-Linux-

      - name: Install research dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt -r requirements-option-validation.txt

      - name: Acquire the daily target only if cache is absent
        continue-on-error: true
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ ! -f data/cache/nifty50_daily.csv ]; then
            python scripts/acquire_data.py --start 2007-01-01 --external
          else
            echo "Reusing the validated/cached NIFTY target series."
          fi

      - name: Validate daily target series
        id: validate_target
        continue-on-error: true
        run: python scripts/validate_data.py

      - name: Unit-test cost and quote-matching functions before acquisition
        run: pytest -q research/option-validation/test_backtest.py

      - name: Acquire or reuse historical rolling option bars
        id: acquire_options
        continue-on-error: true
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          REFRESH_OPTIONS: ${{ github.event.inputs.refresh_options }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          args=""
          if [ "$REFRESH_OPTIONS" = "true" ]; then args="--refresh-options"; fi
          python research/option-validation/backtest.py --acquire-options $args

      - name: Compute option P&L, costs and statistical comparisons
        id: analyze
        if: always()
        continue-on-error: true
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python research/option-validation/backtest.py --analyze

      - name: Re-run unit tests after analysis
        if: always()
        run: pytest -q research/option-validation/test_backtest.py

      - name: Commit sanitized status and result records
        if: always()
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for f in README.md research/PHASE_STATUS.md research/EXPERIMENT_LOG.md research/ERROR_LOG.md research/INTERACTION_LOG.md research/option-validation/RESULTS.md reports/option_validation/acquisition_summary.json reports/option_validation/acquisition_failures.csv reports/option_validation/classifier_manifest.json reports/option_validation/quote_quality.json reports/option_validation/results_summary.json reports/option_validation/performance.csv reports/option_validation/primary_comparisons.csv reports/option_validation/trade_ledger.csv reports/option_validation/signals.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if ! git diff --cached --quiet; then
            git commit -m "research: record option validation run ${{ github.run_id }}"
            git push
          else
            echo "No sanitized status/results changes to commit."
          fi

      - name: Upload sanitized research results only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: option-validation-results-${{ github.run_id }}
          path: |
            research/OPTION_BUYING_VALIDATION_PLAN.md
            research/option-validation/RESULTS.md
            reports/option_validation/acquisition_summary.json
            reports/option_validation/acquisition_failures.csv
            reports/option_validation/classifier_manifest.json
            reports/option_validation/quote_quality.json
            reports/option_validation/results_summary.json
            reports/option_validation/performance.csv
            reports/option_validation/primary_comparisons.csv
            reports/option_validation/trade_ledger.csv
            reports/option_validation/signals.csv
          if-no-files-found: warn
          retention-days: 90
