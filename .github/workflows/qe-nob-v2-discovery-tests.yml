name: QE-NOB-2.0 discovery runner tests

on:
  workflow_dispatch:
  push:
    branches:
      - research/quant-evolve-nob-v2-discovery-developer
    paths:
      - research/quant-evolve-nob/run_discovery_v2.py
      - research/quant-evolve-nob/test_run_discovery_v2.py
      - research/quant-evolve-nob/evolve_candidates_v2.py
      - research/quant-evolve-nob/option_simulator_v2.py
      - research/quant-evolve-nob/signal_evaluator_v2.py
      - research/quant-evolve-nob/feature_builder_v2.py
      - .github/workflows/qe-nob-v2-discovery-tests.yml

permissions:
  contents: read

concurrency:
  group: qe-nob-v2-discovery-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discovery-runner-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install research test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-research.txt scipy pandas numpy requests pytest
      - name: Compile research modules
        run: python -m compileall -q research/quant-evolve-nob
      - name: Test bounded discovery statistics and chronology
        run: pytest -q research/quant-evolve-nob/test_run_discovery_v2.py research/quant-evolve-nob/test_strategy_grammar_v2.py research/quant-evolve-nob/test_evolve_candidates_v2.py research/quant-evolve-nob/test_signal_evaluator_v2.py research/quant-evolve-nob/test_option_simulator_v2.py research/quant-evolve-nob/test_feature_builder_v2.py
