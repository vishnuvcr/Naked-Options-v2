# Generate a fresh Dhan token from the configured client ID, PIN, and TOTP secret at run time.
name: ZigZag expiry direction — acquire timeframe data

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date (YYYY-MM-DD); intraday API is limited to about 5 years"
        required: false
        type: string
        default: "2021-10-25"
      end_date:
        description: "End date (YYYY-MM-DD)"
        required: false
        type: string
        default: "2026-10-25"
      intervals:
        description: "Comma-separated Dhan intervals in minutes"
        required: false
        type: string
        default: "1,5,15,60"
      refresh_data:
        description: "Force a fresh download rather than reusing cached files"
        required: false
        type: boolean
        default: false
  push:
    branches:
      - "research/zigzag-expiry-direction-developer"
      - "research/tradingagents-feasibility-developer"
    paths:
      - "research/zigzag-expiry-direction/acquire_dhan_timeframes.py"
      - "research/zigzag-expiry-direction/prepare_timeframes.py"
      - "research/zigzag-expiry-direction/audit_sessions.py"
      - "tests/test_zigzag_data_pipeline.py"
      - ".github/workflows/zigzag-expiry-timeframes.yml"

permissions:
  contents: read

concurrency:
  group: zigzag-dhan-data-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run data pipeline unit tests
        run: python -m unittest discover -s tests -p "test_zigzag_data_pipeline.py" -v
      - name: Restore reusable cached market data
        uses: actions/cache@v4
        with:
          path: data/cache/zigzag_expiry_direction
          key: zigzag-dhan-v1-${{ runner.os }}-${{ inputs.start_date || '2021-10-25' }}-${{ inputs.end_date || '2026-10-25' }}
      - name: Generate and validate Dhan token
        env:
          DHAN_ACCESS_TOKEN: ${{ secrets.DHAN_ACCESS_TOKEN }}
          DHAN_CLIENT_ID: ${{ secrets.DHAN_CLIENT_ID }}
          DHAN_PIN: ${{ secrets.DHAN_PIN }}
          DHAN_TOTP_SECRET: ${{ secrets.DHAN_TOTP_SECRET }}
        run: |
          if [ -n "${DHAN_ACCESS_TOKEN:-}" ]; then
            export DHAN_ACCESS_TOKEN
            python -c 'import json,os,urllib.request; t=os.environ["DHAN_ACCESS_TOKEN"].strip(); r=urllib.request.Request("https://api.dhan.co/v2/profile",headers={"access-token":t}); p=json.loads(urllib.request.urlopen(r,timeout=30).read().decode()); assert isinstance(p,dict) and p, "empty Dhan profile"; print("::add-mask::"+t); open(os.environ["GITHUB_ENV"],"a").write("DHAN_ACCESS_TOKEN="+t+"\\n"); print("Provided Dhan access token validated successfully.")'
            exit 0
          fi
          python - <<'PY'
            exit 0
          fi
          python - <<'PY'
          import base64, hashlib, hmac, json, os, struct, time, urllib.request
          client = os.environ.get("DHAN_CLIENT_ID", "").strip()
          pin = os.environ.get("DHAN_PIN", "").strip()
          secret = "".join(os.environ.get("DHAN_TOTP_SECRET", "").split()).upper()
          if not client or not pin or not secret:
              raise SystemExit("Required Dhan authentication secrets are missing.")
          try:
              key = base64.b32decode(secret + "=" * ((8 - len(secret) % 8) % 8), casefold=True)
              counter = int(time.time()) // 30
              digest = hmac.new(key, struct.pack(">Q", counter), hashlib.sha1).digest()
              offset = digest[-1] & 15
              code = (struct.unpack(">I", digest[offset:offset+4])[0] & 0x7fffffff) % 1_000_000
              totp = f"{code:06d}"
          except Exception:
              raise SystemExit("Could not generate TOTP; check DHAN_TOTP_SECRET format.") from None
          url = "https://auth.dhan.co/app/generateAccessToken?dhanClientId=" + client + "&pin=" + pin + "&totp=" + totp
          request = urllib.request.Request(url, data=b"", method="POST", headers={"Accept":"application/json"})
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              raise SystemExit("Dhan token generation failed: " + type(exc).__name__ + ". Credentials and response were not logged.") from None
          token = payload.get("accessToken", "") if isinstance(payload, dict) else ""
          if not token:
              raise SystemExit("Dhan did not return a token. Response omitted for safety.")
          print("::add-mask::" + token)
          profile_req = urllib.request.Request("https://api.dhan.co/v2/profile", headers={"access-token": token})
          try:
              with urllib.request.urlopen(profile_req, timeout=30) as response:
                  profile = json.loads(response.read().decode("utf-8"))
          except Exception as exc:
              raise SystemExit("New token failed profile validation: " + type(exc).__name__ + ".") from None
          if str(profile.get("dhanClientId", "")) != client:
              raise SystemExit("Token profile client ID mismatch; refusing to continue.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write("DHAN_ACCESS_TOKEN=" + token + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("Dhan token generated and validated against /v2/profile. Token value is masked and not included in artifacts.\n")
          print("Dhan authentication validated successfully.")
          PY
      - name: Acquire missing or requested Dhan datasets
        env:
          START_DATE: ${{ inputs.start_date || '2021-10-25' }}
          END_DATE: ${{ inputs.end_date || '2026-10-25' }}
          INTERVALS: ${{ inputs.intervals || '1,5,15,60' }}
          REFRESH_DATA: ${{ inputs.refresh_data || 'false' }}
        run: |
          ARGS=(--start "$START_DATE" --end "$END_DATE" --intervals "$INTERVALS")
          if [ "$REFRESH_DATA" = "true" ]; then ARGS+=(--refresh); fi
          python research/zigzag-expiry-direction/acquire_dhan_timeframes.py "${ARGS[@]}"
      - name: Validate data and derive 30-minute bars
        if: always()
        run: python research/zigzag-expiry-direction/prepare_timeframes.py --required 5,15,60,daily
      - name: Audit timestamps and session diagnostics (no silent exclusions)
        if: always()
        run: python research/zigzag-expiry-direction/audit_sessions.py
      - name: Upload dataset and provenance manifest (no secrets)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zigzag-nifty50-data-${{ github.run_id }}
          path: |
            data/cache/zigzag_expiry_direction/*.csv
            reports/zigzag_data_manifest.json
            reports/zigzag_timeframe_validation.json
            reports/zigzag_session_audit.json
          if-no-files-found: warn
          retention-days: 30
