name: NIFTY 50 daily prediction benchmark

on:
  workflow_dispatch:
    inputs:
      refresh_data:
        description: Force a fresh download of free-source daily data
        required: false
        type: boolean
        default: false
  push:
    branches:
      - research/tradingagents-feasibility-developer
      - research/nifty-prediction-developer
    paths:
      - "research/nifty-prediction/acquire_daily_data.py"
      - "research/nifty-prediction/evaluate_daily_models.py"
      - "research/nifty-prediction/audit_source_parity.py"
      - "tests/test_nifty_prediction_benchmark.py"
      - ".github/workflows/nifty-prediction-benchmark.yml"

permissions:
  contents: write

concurrency:
  group: nifty-prediction-benchmark-${{ github.ref }}
  cancel-in-progress: false

jobs:
  daily-direction:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install baseline dependencies
        run: python -m pip install --upgrade pip pandas numpy scikit-learn yfinance pyarrow
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -p "test_nifty_prediction_benchmark.py" -v
      - name: Restore cached daily market data
        uses: actions/cache@v4
        with:
          path: data/cache/nifty-prediction
          key: nifty50-daily-v2-${{ runner.os }}-${{ hashFiles('data/cache/nifty-prediction/nifty50_daily.csv') }}
      - name: Acquire or reuse free daily NIFTY 50 data
        env:
          REFRESH_DATA: ${{ inputs.refresh_data || 'false' }}
        run: |
          ARGS=()
          if [ "$REFRESH_DATA" = "true" ]; then ARGS+=(--refresh); fi
          python research/nifty-prediction/acquire_daily_data.py "${ARGS[@]}"
      - name: Audit OHLC parity against a second free source
        continue-on-error: true
        run: python research/nifty-prediction/audit_source_parity.py
      - name: Run leakage-controlled chronological benchmark
        run: python research/nifty-prediction/evaluate_daily_models.py
      - name: Persist reproducibility data and results to research branch
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for output in \
            data/cache/nifty-prediction/nifty50_daily.csv \
            data/cache/nifty-prediction/source_manifest.json \
            reports/nifty-prediction/daily_benchmark.json \
            reports/nifty-prediction/source_parity_audit.json; do
            if [ -f "$output" ]; then
              git add "$output"
            else
              echo "Optional output absent; not staging: $output"
            fi
          done
          if git diff --cached --quiet; then
            echo "No new reproducibility outputs to commit."
          else
            git commit -m "Record NIFTY prediction benchmark results"
            git pull --rebase origin "${BRANCH_NAME}"
            git push origin "HEAD:${BRANCH_NAME}"
          fi
      - name: Upload reproducibility artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-prediction-daily-benchmark
          path: |
            reports/nifty-prediction/daily_benchmark.json
            data/cache/nifty-prediction/source_manifest.json
            reports/nifty-prediction/source_parity_audit.json
          if-no-files-found: warn
          retention-days: 90

  optional-model-stack-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check optional statistical and uncertainty libraries
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install arch mapie
          python - <<'PY'
          import json
          import importlib.metadata as md
          names = ("arch", "mapie", "scikit-learn")
          result = {}
          for name in names:
              try:
                  result[name] = md.version(name)
              except md.PackageNotFoundError:
                  result[name] = None
          print(json.dumps(result, indent=2))
          PY
