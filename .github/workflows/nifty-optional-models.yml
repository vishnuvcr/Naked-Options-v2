name: NIFTY optional model experiments

on:
  workflow_dispatch:
  push:
    branches:
      - research/tradingagents-feasibility-developer
    paths:
      - "research/nifty-prediction/evaluate_optional_models.py"
      - ".github/workflows/nifty-optional-models.yml"

permissions:
  contents: write

concurrency:
  group: nifty-optional-models
  cancel-in-progress: false

jobs:
  optional-models:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/tradingagents-feasibility-developer
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install core experiment dependencies
        run: python -m pip install --upgrade pip numpy pandas scikit-learn mapie
      - name: Attempt PySR install (optional)
        continue-on-error: true
        run: python -m pip install pysr
      - name: Attempt tick install (optional)
        continue-on-error: true
        run: python -m pip install tick
      - name: Run chronological optional model experiment
        run: python research/nifty-prediction/evaluate_optional_models.py
      - name: Persist experiment report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/nifty-prediction/optional_model_experiments.json
          git commit -m "Record chronological optional model experiment results"
          git fetch origin research/tradingagents-feasibility-developer
          git rebase origin/research/tradingagents-feasibility-developer
          git push origin HEAD:research/tradingagents-feasibility-developer
      - name: Upload optional model report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nifty-optional-model-experiments
          path: reports/nifty-prediction/optional_model_experiments.json
          if-no-files-found: warn
          retention-days: 90
